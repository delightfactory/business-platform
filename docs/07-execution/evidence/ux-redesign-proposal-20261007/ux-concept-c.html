<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F1">
<title>منصة الأعمال — نموذج حي للتصور ج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root{
  /* Light: "Daylight ledger" — neutral paper, deep Nile teal as the single brand color */
  --bg:#F2F3F1;--surface:#FFFFFF;--surface-2:#F6F7F5;--surface-3:#ECEEEA;
  --line:#E2E5E0;--line-2:#CCD1CA;
  --ink:#17201C;--ink-2:#3B4641;--muted:#5D6862;
  --brand:#0E6B5C;--brand-strong:#0A5146;--brand-ink:#FFFFFF;--brand-soft:#E4F0EC;--brand-text:#0B5D50;
  --money:#17201C;--toast-bg:#17201C;--toast-ink:#EEF4F1;--toast-ic:#7ED3C0;
  --pass:#14211D;--pass-2:#1D2D28;--pass-accent:#5CBFAA;--pass-accent-ink:#08201B;--pass-ink:#EEF4F1;--pass-muted:#A9BCB4;--pass-line:rgb(255 255 255 / 12%);
  --ok:#1E7A4C;--ok-bg:#E6F3EB;--ok-text:#17603C;
  --warn:#B4600A;--warn-bg:#FBEEDC;--warn-text:#8A4806;
  --bad:#B42318;--bad-bg:#FBE8E6;--bad-text:#962016;
  --info:#2F5D8C;--info-bg:#E8EFF7;--info-text:#264D75;
  --idle:#97A09B;
  --scrim:rgb(15 22 19 / 45%);
  --sh-1:0 1px 2px rgb(20 33 29 / 6%),0 1px 1px rgb(20 33 29 / 4%);
  --sh-2:0 1px 2px rgb(20 33 29 / 6%),0 8px 24px rgb(20 33 29 / 8%);
  --sh-3:0 24px 60px rgb(20 33 29 / 18%);
  --r-card:16px;--r-tile:12px;--r-ctl:10px;--r-chip:6px;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --f-head:'Alexandria','IBM Plex Sans Arabic',Tahoma,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Dark: "Night ledger" — green-black graphite, teal light, brass reserved for money */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1211;--surface:#141B19;--surface-2:#19211F;--surface-3:#212A27;
  --line:#26302D;--line-2:#34403C;
  --ink:#E7ECE9;--ink-2:#C2CCC7;--muted:#8E9B95;
  --brand:#5CBFAA;--brand-strong:#7ED3C0;--brand-ink:#08201B;--brand-soft:#15302A;--brand-text:#7ED3C0;
  --money:#D9B56E;--toast-bg:#E7ECE9;--toast-ink:#0D1211;--toast-ic:#0E6B5C;
  --pass:#18221F;--pass-2:#202D29;--pass-ink:#E7ECE9;--pass-muted:#93A39C;--pass-line:rgb(255 255 255 / 9%);
  --ok:#55C08A;--ok-bg:#132A1F;--ok-text:#7DD3A6;
  --warn:#E3A048;--warn-bg:#2E2213;--warn-text:#EDB872;
  --bad:#EF7D72;--bad-bg:#331A17;--bad-text:#F29C93;
  --info:#7FA9D6;--info-bg:#16222F;--info-text:#9DBDE0;
  --idle:#5B6762;--scrim:rgb(0 0 0 / 62%);
  --sh-1:0 0 0 1px rgb(255 255 255 / 2%);--sh-2:0 0 0 1px rgb(255 255 255 / 3%),0 10px 30px rgb(0 0 0 / 35%);--sh-3:0 30px 70px rgb(0 0 0 / 60%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1211;--surface:#141B19;--surface-2:#19211F;--surface-3:#212A27;
  --line:#26302D;--line-2:#34403C;
  --ink:#E7ECE9;--ink-2:#C2CCC7;--muted:#8E9B95;
  --brand:#5CBFAA;--brand-strong:#7ED3C0;--brand-ink:#08201B;--brand-soft:#15302A;--brand-text:#7ED3C0;
  --money:#D9B56E;--toast-bg:#E7ECE9;--toast-ink:#0D1211;--toast-ic:#0E6B5C;
  --pass:#18221F;--pass-2:#202D29;--pass-ink:#E7ECE9;--pass-muted:#93A39C;--pass-line:rgb(255 255 255 / 9%);
  --ok:#55C08A;--ok-bg:#132A1F;--ok-text:#7DD3A6;
  --warn:#E3A048;--warn-bg:#2E2213;--warn-text:#EDB872;
  --bad:#EF7D72;--bad-bg:#331A17;--bad-text:#F29C93;
  --info:#7FA9D6;--info-bg:#16222F;--info-text:#9DBDE0;
  --idle:#5B6762;--scrim:rgb(0 0 0 / 62%);
  --sh-1:0 0 0 1px rgb(255 255 255 / 2%);--sh-2:0 0 0 1px rgb(255 255 255 / 3%),0 10px 30px rgb(0 0 0 / 35%);--sh-3:0 30px 70px rgb(0 0 0 / 60%);
  color-scheme:dark}

html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-text)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums lining-nums}
.money{color:var(--money);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
h1,h2,h3,p{margin:0}

/* ============ Top bar ============ */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:stretch;gap:24px;min-height:64px;padding:0 clamp(16px,3vw,32px);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:600 13px var(--f-head);letter-spacing:.3px;flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.25}
.brand-t strong{font:600 14px var(--f-head)}
.brand-t small{font-size:12px;color:var(--muted)}
.navpills{display:flex;gap:2px;flex:1;align-items:stretch}
.pill{position:relative;display:inline-flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.pill:hover{color:var(--ink)}
.pill[aria-current="page"]{color:var(--ink);font-weight:600}
.pill[aria-current="page"]::after{content:"";position:absolute;inset-inline:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand)}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-3);color:var(--ink-2);font-size:11px;font-weight:600;display:grid;place-items:center}
.pill[aria-current="page"] .cnt{background:var(--brand);color:var(--brand-ink)}
.top-end{display:flex;align-items:center;gap:6px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:var(--r-ctl);border:1px solid transparent;background:transparent;color:var(--ink-2);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line)}
.dot{position:absolute;top:9px;left:10px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}
.rolebtn{display:flex;align-items:center;gap:10px;height:44px;padding:0 4px 0 10px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-right:6px}
.rolebtn:hover{background:var(--surface-2)}
.rolemeta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.3;text-align:right}
.rolemeta b{font-size:13px;font-weight:600}
.rolemeta small{font-size:11px;color:var(--muted)}

/* ============ Page ============ */
.page{max-width:1240px;margin:0 auto;padding:32px clamp(16px,3vw,32px) 64px;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.hero{font:600 clamp(22px,2.4vw,30px)/1.45 var(--f-head);letter-spacing:-.2px;max-width:760px;text-wrap:pretty}
.h1{font:600 clamp(22px,2.2vw,28px)/1.4 var(--f-head);letter-spacing:-.2px}
.h2{font:600 16px/1.5 var(--f-head)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;min-width:0;box-shadow:var(--sh-1)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.split>.wide{flex:3 1 560px;min-width:0}
.split>.narrow{flex:2 1 320px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ============ Semantic tones (quiet fills, strong text) ============ */
.t-mint{background:var(--ok-bg);color:var(--ok-text)}
.t-peach{background:var(--warn-bg);color:var(--warn-text)}
.t-rose{background:var(--bad-bg);color:var(--bad-text)}
.t-lilac{background:var(--brand-soft);color:var(--brand-text)}
.t-sky{background:var(--info-bg);color:var(--info-text)}
.t-neutral{background:var(--surface-3);color:var(--ink-2)}

/* ============ Buttons & chips ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid transparent;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn-solid,.btn-primary{background:var(--brand);color:var(--brand-ink);box-shadow:inset 0 -1px 0 rgb(0 0 0 / 14%)}
.btn-solid:hover,.btn-primary:hover{background:var(--brand-strong)}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--surface);border-color:var(--line-2);color:var(--bad-text)}
.btn-danger:hover{background:var(--bad-bg);border-color:transparent}
.btn-lg{min-height:48px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--r-chip);font-size:12px;font-weight:600;white-space:nowrap}
.chips{display:inline-flex;gap:2px;flex-wrap:wrap;padding:3px;border-radius:12px;background:var(--surface-3)}
.filter{height:36px;padding:0 14px;border-radius:9px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.filter:hover{color:var(--ink)}
.filter[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none;background:var(--surface-3)!important;color:var(--ink-2)!important;font-family:var(--f-head)}
.av32{width:30px;height:30px;font-size:12px}.av40{width:38px;height:38px;font-size:14px}.av48{width:44px;height:44px;font-size:15px}.av64{width:56px;height:56px;font-size:20px}
.stackav{display:flex;padding-right:6px}
.stackav .av{box-shadow:0 0 0 2px var(--surface);margin-right:-6px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand-text);font-weight:600;font-size:14px;min-height:40px}

/* ============ Task cards: count-first, with real items ============ */
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh-1)}
.task .tk{display:flex;align-items:center;justify-content:space-between;gap:12px}
.task .k{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.task .k i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.task .big{font:600 44px/1 var(--f-head);color:var(--ink);font-variant-numeric:tabular-nums}
.task h2{font:600 16px/1.5 var(--f-head);color:var(--ink)}
.task p{font-size:13px;line-height:1.7;color:var(--muted)}
.task ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.task li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.task li span:last-child{color:var(--muted);white-space:nowrap}
.task .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:12px}
.task.done .big{color:var(--idle)}

/* ============ People ============ */
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:14px 6px}
.pp{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:8px 4px;border-radius:var(--r-tile);color:var(--ink-2);font-size:12px}
.pp:hover{background:var(--surface-2)}
.pp .av{position:relative;width:46px;height:46px;font-size:15px}
.pp .av::after{content:"";position:absolute;bottom:0;left:0;width:11px;height:11px;border-radius:50%;background:var(--ring);box-shadow:0 0 0 2.5px var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* ============ Feed ============ */
.feed{display:flex;gap:12px;align-items:flex-start}
.feed .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.feed p{font-size:14px;line-height:1.7;color:var(--ink-2)}
.feed small{font-size:12px;color:var(--muted)}
.feed.new{animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ============ Inbox ============ */
.inbox{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:16px;align-items:start}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--sh-1)}
.qlist li+li{border-top:1px solid var(--line)}
.qi{position:relative;width:100%;display:flex;align-items:flex-start;gap:12px;text-align:right;padding:14px 16px;border:0;background:transparent;color:var(--ink)}
.qi:hover{background:var(--surface-2)}
.qi.on{background:var(--brand-soft)}
.qi.on::before{content:"";position:absolute;inset-block:10px;right:0;width:3px;border-radius:3px 0 0 3px;background:var(--brand)}
.qi-b{flex:1;display:flex;flex-direction:column;min-width:0;line-height:1.55}
.qi-b b{font-size:14px;font-weight:600}
.qi-b span{font-size:13px;color:var(--ink-2)}
.qi-b small{font-size:12px;color:var(--muted)}
.qi-e{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.qi-e small{font-size:11px;color:var(--muted)}
.detail{position:sticky;top:84px;display:flex;flex-direction:column;gap:20px;padding:24px 26px}
.back-m{display:none}
.dhead{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.dhead h2{font:600 22px/1.5 var(--f-head);letter-spacing:-.2px}
.facts{display:flex;flex-direction:column;gap:10px}
.fact{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.7;color:var(--ink-2)}
.fact .fi{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.bubble{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:14px 14px 14px 4px;padding:12px 16px;font-size:14px;line-height:1.75}
.daterng{display:flex;align-items:center;gap:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-tile);padding:14px 18px}
.daterng .d{display:flex;flex-direction:column;align-items:center;min-width:52px}
.daterng .d b{font:600 28px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.daterng .d small{font-size:12px;color:var(--muted)}
.dash{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line-2) 0 5px,transparent 5px 9px)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-tile);overflow:hidden}
.kv div{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--surface-2)}
.kv div+div{border-right:1px solid var(--line)}
.kv small{font-size:12px;color:var(--muted)}
.kv b{font-size:15px;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
.actions .btn{flex:1 1 140px}
.actions .grow{flex:2 1 200px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field label span{color:var(--muted);font-weight:400}
.input,.textarea,.select{width:100%;min-height:44px;padding:9px 14px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.textarea{min-height:84px;resize:vertical;line-height:1.7}
.input:focus,.textarea:focus,.select:focus,.input:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.hint{font-size:12px;color:var(--muted)}
.steprow{display:flex;align-items:center;gap:10px;min-height:54px;border-top:1px solid var(--line)}
.steprow:first-child{border-top:0}
.steprow span{flex:1;font-size:14px}
.stepbtn{width:40px;height:40px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.stepbtn:hover{background:var(--surface-2)}
.stepbtn[disabled]{opacity:.35;cursor:not-allowed}
.steprow output{width:52px;text-align:center;font:600 18px var(--f-head);font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--warn);transition:width .25s}
.meter.full i{background:var(--ok)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:56px 20px;color:var(--muted)}
.empty .ei{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.empty b{color:var(--ink);font:600 17px var(--f-head)}
.map{border-radius:var(--r-tile);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}

/* ============ Tables ============ */
.tablewrap{overflow-x:auto;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1)}
table{width:100%;border-collapse:collapse;min-width:620px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:11px 18px;border-bottom:1px solid var(--line);font-size:14px}
tbody tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.who small{display:block;font-size:12px;color:var(--muted)}

/* ============ Week grid ============ */
.week{display:grid;grid-template-columns:120px repeat(5,minmax(0,1fr));gap:8px 4px;align-items:center}
.week .dh{font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
.week .dh.today{color:var(--brand-text);font-weight:700}
.week .nm{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week .bar{height:28px;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600}
.week .bar.pending{background:transparent;border:1.5px dashed var(--brand);color:var(--brand-text)}

/* ============ Payroll ============ */
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.step{display:flex;flex-direction:column;gap:6px}
.step .bar{height:4px;border-radius:2px;background:var(--surface-3)}
.step.done .bar{background:var(--brand)}
.step.cur .bar{background:linear-gradient(90deg,var(--surface-3) 50%,var(--warn) 50%)}
.step b{font-size:13px;font-weight:600}
.step small{font-size:12px;color:var(--muted)}
.step.done small{color:var(--brand-text)}
.step.cur small{color:var(--warn-text);font-weight:600}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-tile);overflow:hidden}

@media (max-width:980px){.pill{padding:0 10px}}
@media (max-width:860px){

  .page{padding-top:20px;padding-bottom:110px;gap:16px}

  .back-m{display:inline-grid;border-color:var(--line)}

  .emp-grid{grid-template-columns:1fr}
  .scrim{align-items:flex-end}
  .drawer{height:auto;max-height:92%;border-radius:20px 20px 0 0;border-right:0;border-top:1px solid var(--line);animation:sheetin .25s cubic-bezier(.2,.8,.2,1)}
  .week{grid-template-columns:84px repeat(5,minmax(0,1fr))}
  .kv div+div{border-right:0}

}
@keyframes sheetin{from{transform:translateY(24px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function reasonField(x,label,need){return `<div class="field"><label for="r-${x.id}">${label} <span>${need?'(مطلوب)':'(اختياري)'}</span></label><textarea class="textarea" id="r-${x.id}" data-in="reason" data-id="${x.id}" placeholder="اكتب السبب كما سيظهر في سجل التدقيق">${esc(x.reason||'')}</textarea></div>`}

}

  if(n<0){ok=false;msg='تاريخ النهاية قبل تاريخ البداية. عدّل أحد التاريخين.'}
  else if(n===0){ok=false;msg='الأيام المختارة كلها عطلة أسبوعية. اختر يوم عمل واحدًا على الأقل.'}
  else if(t!=='مرضية'&&n>avail()){ok=false;msg=`تطلب ${daysWord(n)} ورصيدك المتاح ${daysWord(avail())}. قلّل المدة أو اختر نوعًا آخر.`}
  else msg=t==='مرضية'?`مدة الطلب ${daysWord(n)}. لا تُخصم من رصيدك، وسيُطلب منك رفع التقرير.`:`مدة الطلب ${daysWord(n)} بعد استبعاد الجمعة والسبت. يبقى لك ${daysWord(avail()-n)} بعد الموافقة.`;
  box.className='banner '+(ok?'t-lilac':'t-rose');box.innerHTML=ic(ok?'cal':'alert',20,2)+`<span>${msg}</span>`;btn.disabled=!ok;
}

/* ---------- Punch ---------- */
function punch(){
  if(S.punch.busy)return;
  if(!navigator.onLine){S.punch.unconfirmed=S.punch.state==='out'?'in':'out';render(true);toast('لم يتأكد التسجيل. سنتحقق من المحاولة نفسها عند عودة الاتصال.','alert');return}
  const goingIn=S.punch.state==='out';
  S.punch.busy=true;render(true);
  setTimeout(()=>{
    const t=nowT();S.punch.busy=false;
    if(goingIn){S.punch.state='in';S.punch.inAt=t;S.punch.inDate=Date.now();S.receipts.unshift({dir:'حضور',t,d:'اليوم',st:'ok',src:'موبايل، داخل النطاق، إيصال معتمد'});toast(`سُجّل حضورك الساعة ${t}. وصلك إيصال معتمد.`,'check')}
    else{S.punch.state='done';S.punch.outAt=t;S.receipts.unshift({dir:'انصراف',t,d:'اليوم',st:'ok',src:'موبايل، داخل النطاق، إيصال معتمد'});toast(`سُجّل انصرافك الساعة ${t}. يومًا موفقًا.`,'check')}
    render(true);
  },1100);
}
function wireSlider(){
  const knob=document.getElementById('knob');if(!knob)return;
  const track=document.getElementById('slide');let start=null,dx=0,max=0;
  knob.addEventListener('pointerdown',e=>{start=e.clientX;dx=0;max=track.clientWidth-knob.offsetWidth-12;knob.setPointerCapture(e.pointerId);track.classList.add('drag')});
  knob.addEventListener('pointermove',e=>{if(start==null)return;dx=Math.min(max,Math.max(0,start-e.clientX));knob.style.transform=`translateX(${-dx}px)`;track.style.setProperty('--p',(dx/max).toFixed(3))});
  const end=()=>{if(start==null)return;const done=dx>max*0.8;start=null;track.classList.remove('drag');if(done){knob.style.transform=`translateX(${-max}px)`;punch()}else{knob.style.transform='';track.style.setProperty('--p',0);if(dx<6)toast('اسحب المقبض حتى نهاية الشريط لتأكيد التسجيل.','left')}};
  knob.addEventListener('pointerup',end);knob.addEventListener('pointercancel',end);
  knob.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();punch()}});
}
setInterval(()=>{const el=document.getElementById('elapsed');if(el)el.textContent=elapsed()},30000);

/* ---------- Decisions ---------- */
function decide(id,o){
  const x=S.inbox.find(i=>i.id===id);if(!x)return;
  const yes=o==='yes',first=x.who.split(' ')[0];let msg='',fx='';
  switch(x.kind){
    case 'leave':msg=yes?`تمت الموافقة على إجازة ${first}. وصلها إشعار بالقرار.`:`رُفض طلب ${first}. وصلها الإشعار مع ملاحظتك.`;fx=yes?`وافق ${USERS[S.role].short} على إجازة ${x.who}، ${daysWord(x.days)}.`:`رفض ${USERS[S.role].short} طلب إجازة ${x.who}.`;break;
    case 'ot':msg=yes?`اعتُمد تصنيف ${x.rounded} دقيقة إضافية لـ${first}، وأصبحت جاهزة للمسير.`:`رُفض الإضافي لـ${first}.`;fx=yes?`صُنفت ${x.rounded} دقيقة إضافية لياسمين فؤاد واعتُمدت.`:`رُفض إضافي ياسمين فؤاد ليوم 6 أكتوبر.`;break;
    case 'geo':msg=yes?`قُبل تسجيل ${first}. أُعيد تفسير يومه وحُسب حضوره.`:`رُفض التسجيل. يظهر يوم ${first} كبصمة ناقصة.`;fx=yes?'قُبل تسجيل محمود الشريف من خارج النطاق بعد المراجعة.':'رُفض تسجيل محمود الشريف من خارج النطاق.';{const p=person('p9');p.st=yes?'in':'out'}break;
    case 'missing':msg=`أُضيف انصراف ${first} الساعة ${t12(x.outT)} كتسجيل تصحيحي.`;fx=`صُحح يوم أحمد سمير بانصراف ${t12(x.outT)}.`;break;
    case 'absence':msg=`اعتُمد يوم غياب لـ${first} بتاريخ 5 أكتوبر.`;fx='اعتُمد غياب خالد منصور يوم 5 أكتوبر.';break;
    case 'unmapped':msg=`رُبط تسجيل ${first} بيوم 6 أكتوبر وأُعيد تفسير اليوم.`;fx='رُبط تسجيل حسام وجدي المحفوظ بيوم عمله بعد ضبط التعيين.';break;
  }
  const list=inboxFor(S.role).filter(i=>S.filter==='all'||(S.filter==='leave'?i.kind==='leave':i.kind!=='leave'));
  const idx=list.findIndex(i=>i.id===id);
  S.inbox=S.inbox.filter(i=>i.id!==id);
  const rest=list.filter(i=>i.id!==id);
  S.sel=isMobile()?null:(rest[idx]||rest[idx-1]||null)?.id||null;
  addFeed(yes?'check':'x',yes?'mint':'rose',fx);
  render(true);toast(msg,yes?'check':'x');
}

/* ---------- Events ---------- */
const ACT={
  go:d=>{S.view=d.v;if(d.v!=='inbox')S.sel=null;closeDrawer(true);render()},
  inbox:d=>{S.view='inbox';S.filter=d.f||'all';S.sel=null;render()},
  filter:d=>{S.filter=d.f;S.sel=null;render(true)},
  tfilter:d=>{S.tfilter=d.f;render(true)},
  open:d=>{S.sel=d.id;render(true);if(isMobile()){const dt=document.querySelector('.detail');dt&&dt.scrollTo(0,0);const b=document.querySelector('.detail .back-m');b&&b.focus()}else{const h=document.querySelector('.detail h2');h&&h.setAttribute('tabindex','-1');h&&h.focus({preventScroll:true})}},
  close:()=>{const id=S.sel;S.sel=null;render(true);const b=document.querySelector(`[data-act="open"][data-id="${id}"]`);b&&b.focus()},
  decide:d=>decide(d.id,d.o),
  ask:d=>{const x=S.inbox.find(i=>i.id===d.id);toast(`أُرسل سؤال إلى ${x.who.split(' ')[0]}. يبقى القرار مفتوحًا حتى يرد.`,'inbox')},
  ot:d=>{const x=S.inbox.find(i=>i.id===d.id);const sum=Object.values(x.alloc).reduce((a,b)=>a+b,0);const dd=Number(d.d);if(dd>0&&sum>=x.rounded)return;x.alloc[d.b]=Math.max(0,x.alloc[d.b]+dd);render(true);const btn=document.querySelector(`[data-act="ot"][data-b="${d.b}"][data-d="${d.d}"]`);if(btn&&!btn.disabled)btn.focus()},
  theme:()=>{document.documentElement.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('te-theme',document.documentElement.dataset.theme)}catch(e){}render(true)},
  roles:()=>rolesDrawer(),
  setrole:d=>{S.role=d.r;S.view='today';S.sel=null;S.filter='all';closeDrawer(true);render();toast(`تشاهد الآن المنصة بصفة ${ROLE_INFO[d.r][0]}.`,'swap')},
  notify:()=>notifyDrawer(),
  brand:d=>{S.brand=d.k;render(true);rolesDrawer()},
  notes:()=>{S.notes=!S.notes;render(true);rolesDrawer()},
  dclose:()=>closeDrawer(),
  person:d=>personDrawer(d.id),
  soon:d=>toast(d.m,'spark'),
  block:d=>{const b=S.blockers.find(x=>x.id===d.id);if(b.link){if(S.inbox.some(x=>x.id===b.link)){S.view='inbox';S.filter='all';S.sel=b.link;render()}return}b.ok=true;addFeed('check','mint',`حُل مانع في مسير أكتوبر: ${b.title}.`);render(true);toast(`تم: ${b.title}. ${openBlockers().length?count(openBlockers().length,'يتبقى مانع واحد.','يتبقى مانعان.','موانع متبقية.'):'لا موانع متبقية، يمكنك الانتقال إلى الحساب.'}`,'check')},
  paynext:()=>{if(S.pay.step===3){S.pay.busy=true;render(true);setTimeout(()=>{S.pay.busy=false;S.pay.step=4;addFeed('wallet','lilac','اكتمل الحساب المبدئي لمسير أكتوبر.');render(true);toast('اكتمل الحساب. راجع الفروقات ثم أرسل للاعتماد.','check')},1600)}else if(S.pay.step===4){S.pay.step=5;addFeed('shield','lilac','أُرسل مسير أكتوبر للاعتماد المالي.');render(true);toast('أُرسل المسير للاعتماد. سيصلك إشعار عند الاعتماد.','check')}},
  payreset:()=>{S.pay.step=3;S.blockers.forEach(b=>{if(!b.link)b.ok=false});render(true)},
  leavesheet:()=>leaveSheet(),
  submitleave:()=>{const t=document.getElementById('lt').value,a=document.getElementById('lf').value,b=document.getElementById('lto').value,n=workDays(a,b);S.myLeaves.unshift({id:'m'+Date.now(),type:t,from:a,to:b,days:n,st:'pending'});closeDrawer(true);S.view='leave';render();toast(`أُرسل طلب إجازة ${daysWord(n)} إلى مديرك. ستصلك رسالة عند القرار.`,'check')},
  withdraw:d=>{const l=S.myLeaves.find(x=>x.id===d.id);l.st='withdrawn';render(true);toast('سُحب الطلب وعاد الرصيد كما كان.','check')},
  punchverify:()=>{if(!navigator.onLine){toast('ما زال الاتصال مقطوعًا. أعد التحقق عند عودته.','alert');return}S.punch.unconfirmed=null;S.punch.state=S.punch.state;punch()},
  punchreset:()=>{S.punch={state:'out',busy:false,inAt:null,outAt:null};S.receipts=S.receipts.filter(r=>r.d!=='اليوم');render(true)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;if(t.tagName==='A')e.preventDefault();const f=ACT[t.dataset.act];f&&f(t.dataset,e,t)});
document.addEventListener('input',e=>{
  const t=e.target;const k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='q'){S.q=t.value;document.getElementById('plist').innerHTML=peopleCards(PEOPLE.filter(p=>!S.q.trim()||p.n.includes(S.q.trim())||p.code.includes(S.q.trim())||p.dept.includes(S.q.trim())));return}
  if(k==='lcalc'){calcLeave();return}
  if(k==='employer'){S.employer=t.value;S.pay={step:3,busy:false};S.blockers.forEach(b=>{if(!b.soft)b.ok=false});render(true);toast('تعرض الآن مسير الجهة المختارة. لكل جهة دورة ومسير مستقلان.','bank');return}
  const x=S.inbox.find(i=>i.id===t.dataset.id);if(!x)return;
  x[k]=t.value;
  const b=document.getElementById('primary-act');if(b&&x.kind!=='leave')b.disabled=!ready(x);
  const rj=document.getElementById('reject-act');if(rj&&x.kind==='leave')rj.disabled=(x.reason||'').trim().length<3;
  if(x.kind==='geo')document.querySelectorAll('[data-act="decide"]').forEach(btn=>btn.disabled=!ready(x));
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('scrim'))closeDrawer();else if(S.sel&&isMobile())ACT.close()}});
let wasMobile=isMobile();
window.addEventListener('resize',()=>{const m=isMobile();if(m!==wasMobile){wasMobile=m;render(true)}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme)render(true)});

try{const th=localStorage.getItem('te-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
const syncOnline=()=>document.body.classList.toggle('is-offline',!navigator.onLine);
window.addEventListener('online',()=>{syncOnline();toast('عاد الاتصال.','check')});window.addEventListener('offline',syncOnline);syncOnline();
const h=(location.hash||'').slice(1);if(['emp','mgr','hr'].includes(h))S.role=h;
render();
})();
</script>
