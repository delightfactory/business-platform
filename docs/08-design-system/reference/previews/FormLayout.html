<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>FormLayout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<script src="../icons.js"></script>
<style>html,body{margin:0}body{padding:20px;background:var(--canvas)}.demo-grid{display:grid;gap:20px}.demo-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;align-items:start}.demo-cap{color:var(--text-subtle);font-size:12px;line-height:18px;margin-bottom:8px}</style></head>
<body class="bp">
<div class="bp-card" style="max-width:1100px;margin:auto">
 <div class="bp-card__head"><div class="bp-steps" style="flex:1">
   <span class="bp-step bp-step--done"><span class="bp-step__dot"><i data-icon="check" class="bp-icon--sm"></i></span>البيانات الأساسية</span><span class="bp-steps__line"></span>
   <span class="bp-step bp-step--current"><span class="bp-step__dot">2</span>العمل والفرع</span><span class="bp-steps__line"></span>
   <span class="bp-step"><span class="bp-step__dot">3</span>الأجر</span><span class="bp-steps__line"></span>
   <span class="bp-step"><span class="bp-step__dot">4</span>المراجعة</span></div></div>
 <div style="padding-inline:20px">
  <div class="bp-form-section"><div><h3 class="bp-form-section__title">جهة العمل</h3><p class="bp-form-section__desc">تحدد جهة التوظيف الفروع المتاحة وكشف الرواتب الذي يتبعه الموظف.</p></div>
   <div class="bp-form-grid">
    <div class="bp-field"><label class="bp-label">جهة التوظيف</label><div class="bp-control"><select class="bp-select"><option>شركة النور للتجارة</option></select><i data-icon="chevron-down"></i></div></div>
    <div class="bp-field"><label class="bp-label">الفرع</label><div class="bp-control"><select class="bp-select"><option>فرع المعادي</option></select><i data-icon="chevron-down"></i></div></div>
    <div class="bp-field"><label class="bp-label">تاريخ بداية العمل</label><div class="bp-control"><input class="bp-input" value="1 ديسمبر 2026"><i data-icon="calendar"></i></div><p class="bp-hint">تاريخ مستقبلي: يظهر الموظف بحالة «يبدأ قريبًا».</p></div>
   </div></div>
  <div class="bp-form-section" style="border-bottom:0"><div><h3 class="bp-form-section__title">الموقع في الهيكل</h3><p class="bp-form-section__desc">يمكن استكماله لاحقًا من ملف الموظف.</p></div>
   <div class="bp-form-grid">
    <div class="bp-field"><label class="bp-label">القسم <span class="bp-opt">(اختياري)</span></label><div class="bp-control bp-control--lead"><input class="bp-input" value="المبيعات"><i data-icon="search"></i></div></div>
    <div class="bp-field"><label class="bp-label">الوظيفة <span class="bp-opt">(اختياري)</span></label><div class="bp-control bp-control--lead"><input class="bp-input" placeholder="ابحث عن وظيفة…"><i data-icon="search"></i></div></div>
   </div></div>
 </div>
 <div class="bp-actionbar"><span class="bp-muted" style="font-size:13px">حُفظت المسودة منذ دقيقة</span><span class="bp-spacer"></span>
  <button class="bp-btn bp-btn--ghost">إلغاء</button><button class="bp-btn bp-btn--secondary"><i data-icon="arrow-right"></i>السابق</button><button class="bp-btn bp-btn--primary">التالي: الأجر</button></div>
</div>
<script>window.BP&&BP.init(document)</script>
</body>
</html>
