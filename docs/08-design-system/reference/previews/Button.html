<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<script src="../icons.js"></script>
<style>html,body{margin:0}body{padding:20px;background:var(--surface)}.demo-grid{display:grid;gap:20px}.demo-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;align-items:start}.demo-cap{color:var(--text-subtle);font-size:12px;line-height:18px;margin-bottom:8px}</style></head>
<body class="bp">
<div class="demo-grid">
 <div><p class="demo-cap">الأنواع: أساسي واحد لكل منطقة، ثانوي، شبحي، هدّام</p>
  <div class="bp-row">
   <button class="bp-btn bp-btn--primary"><i data-icon="plus"></i>إضافة موظف</button>
   <button class="bp-btn bp-btn--secondary"><i data-icon="upload"></i>استيراد</button>
   <button class="bp-btn bp-btn--ghost">إلغاء</button>
   <button class="bp-btn bp-btn--danger">تعطيل العضوية</button>
   <button class="bp-btn bp-btn--danger-ghost"><i data-icon="trash"></i>إلغاء الدعوة</button>
   <button class="bp-btn bp-btn--link">عرض الكل</button>
  </div></div>
 <div><p class="demo-cap">الأحجام 32 / 36 / 44، وزر الأيقونة</p>
  <div class="bp-row">
   <button class="bp-btn bp-btn--secondary bp-btn--sm">صغير</button>
   <button class="bp-btn bp-btn--secondary">افتراضي</button>
   <button class="bp-btn bp-btn--secondary bp-btn--lg">كبير للهاتف</button>
   <button class="bp-btn bp-btn--ghost bp-btn--icon" aria-label="إجراءات أخرى"><i data-icon="more"></i></button>
   <button class="bp-btn bp-btn--secondary bp-btn--icon bp-btn--sm" aria-label="تصدير"><i data-icon="download"></i></button>
  </div></div>
 <div><p class="demo-cap">الحالات: جارٍ التنفيذ، معطّل</p>
  <div class="bp-row">
   <button class="bp-btn bp-btn--primary" aria-busy="true"><span class="bp-spinner"></span>جارٍ الحفظ…</button>
   <button class="bp-btn bp-btn--primary" disabled>حفظ التغييرات</button>
   <button class="bp-btn bp-btn--secondary" disabled>استيراد</button>
  </div></div>
</div>
<script>window.BP&&BP.init(document)</script>
</body>
</html>
