<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Menu</title>

<body class="bp">
<div class="bp-row" style="align-items:flex-start;gap:28px">
 <div class="bp-menu" role="menu">
  <button class="bp-menu__item" role="menuitem"><i data-icon="user"></i>فتح الملف</button>
  <button class="bp-menu__item" role="menuitem"><i data-icon="edit"></i>تعديل بيانات العمل</button>

 </div>
 <div class="bp-menu" role="menu" style="width:264px">

  <div class="bp-menu__sep"></div>
  <button class="bp-menu__item" role="menuitem"><i data-icon="sliders"></i>إعدادات الحساب</button>
  <button class="bp-menu__item" role="menuitem"><i data-icon="logout"></i>تسجيل الخروج</button>
 </div>
</div>
<script>window.BP&&BP.init(document)</script>
