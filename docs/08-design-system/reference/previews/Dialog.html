<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Dialog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<script src="../icons.js"></script>
<style>html,body{margin:0}body{padding:0px;background:var(--surface)}.demo-grid{display:grid;gap:20px}.demo-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;align-items:start}.demo-cap{color:var(--text-subtle);font-size:12px;line-height:18px;margin-bottom:8px}</style></head>
<body class="bp">
<div class="bp-backdrop" style="min-height:360px;border-radius:8px">
 <div class="bp-dialog" role="alertdialog" aria-labelledby="dlg-t">
  <div class="bp-dialog__head"><h2 class="bp-dialog__title" id="dlg-t">خفض دور أحمد سامي إلى عضو؟</h2><button class="bp-btn bp-btn--ghost bp-btn--icon bp-btn--sm" aria-label="إغلاق"><i data-icon="x"></i></button></div>
  <div class="bp-dialog__body"><ul class="bp-impact"><li><i data-icon="shield"></i>يفقد صلاحيات إدارة الشركة فورًا.</li><li><i data-icon="users"></i>تبقى عضويته فعّالة ولا يتغير عدد المقاعد.</li><li><i data-icon="info"></i>يمكن ترقيته مجددًا في أي وقت.</li></ul></div>
  <div class="bp-dialog__foot"><button class="bp-btn bp-btn--secondary">إلغاء</button><button class="bp-btn bp-btn--danger">خفض الدور</button></div>
 </div>
</div>
<script>window.BP&&BP.init(document)</script>
</body>
</html>
